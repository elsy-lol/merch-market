{% extends 'admin2/base.html' %}
{% block title %}{% if product %}Редактировать{% else %}Добавить{% endif %} товар{% endblock %}
{% block content %}
<h1>{% if product %}✏️ {{ product.name }}{% else %}📦 Новый товар{% endif %}</h1>
<form method="post" class="form-card">
  {% csrf_token %}
  <div class="form-group">
    <label>Название *</label>
    <input name="name" value="{{ product.name|default:'' }}" required>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Артист</label>
      <select name="creator_id">
        <option value="">—</option>
        {% for a in artists %}
        <option value="{{ a.id }}" {% if product.creator_id == a.id %}selected{% endif %}>{{ a.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Категория</label>
      <select name="category_id">
        <option value="">—</option>
        {% for c in categories %}
        <option value="{{ c.id }}" {% if product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Цена (₽)</label>
      <input name="price" type="number" step="0.01" value="{{ product.price|default:'0' }}">
    </div>
    <div class="form-group">
      <label>Тип</label>
      <select name="product_type">
        <option value="tshirt" {% if product.product_type == 'tshirt' %}selected{% endif %}>Футболка</option>
        <option value="hoodie" {% if product.product_type == 'hoodie' %}selected{% endif %}>Худи</option>
        <option value="cap" {% if product.product_type == 'cap' %}selected{% endif %}>Кепка</option>
        <option value="vinyl" {% if product.product_type == 'vinyl' %}selected{% endif %}>Винил</option>
        <option value="cassette" {% if product.product_type == 'cassette' %}selected{% endif %}>Кассета</option>
        <option value="accessory" {% if product.product_type == 'accessory' %}selected{% endif %}>Аксессуар</option>
      </select>
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label>Состояние</label>
      <select name="condition">
        <option value="new" {% if product.condition == 'new' %}selected{% endif %}>Новый</option>
        <option value="secondhand" {% if product.condition == 'secondhand' %}selected{% endif %}>Б/У</option>
      </select>
    </div>
    <div class="form-group">
      <label>Статус</label>
      <select name="status">
        <option value="active" {% if product.status == 'active' %}selected{% endif %}>Активен</option>
        <option value="draft" {% if product.status == 'draft' %}selected{% endif %}>Черновик</option>
        <option value="archived" {% if product.status == 'archived' %}selected{% endif %}>Архив</option>
      </select>
    </div>
  </div>
  <div class="form-group">
    <label>Описание</label>
    <textarea name="description" rows="4">{{ product.description|default:'' }}</textarea>
  </div>
  <hr style="border-color:var(--border);margin:16px 0;">
  <h3 style="font-size:15px;font-weight:600;margin-bottom:12px;">📐 Первый вариант (размер/остаток)</h3>
  <div class="form-row">
    <div class="form-group">
      <label>Размер</label>
      <input name="size" value="{{ product.variants.first.size|default:'' }}" placeholder="S, M, L, XL или оставить пустым">
    </div>
    <div class="form-group">
      <label>Остаток на складе</label>
      <input name="stock" type="number" value="{{ product.variants.first.stock|default:'1' }}">
    </div>
  </div>
  <div class="flex gap-2 mt-4">
    <button type="submit" class="btn btn-gold">💾 Сохранить</button>
    <a href="{% url 'admin-product-list' %}" class="btn btn-ghost">Отмена</a>
  </div>
</form>
{% endblock %}
