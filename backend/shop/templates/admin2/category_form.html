{% extends 'admin2/base.html' %}
{% block title %}{% if category %}Редактировать{% else %}Добавить{% endif %} категорию{% endblock %}
{% block content %}
<h1>{% if category %}✏️ {{ category.name }}{% else %}🏷️ Новая категория{% endif %}</h1>
<form method="post" class="form-card">
  {% csrf_token %}
  <div class="form-row">
    <div class="form-group">
      <label>Название *</label>
      <input name="name" value="{{ category.name|default:'' }}" required>
    </div>
    <div class="form-group">
      <label>Slug *</label>
      <input name="slug" value="{{ category.slug|default:'' }}" required>
    </div>
  </div>
  <div class="form-group">
    <label>Родительская категория</label>
    <select name="parent_id">
      <option value="">—</option>
      {% for p in parents %}
      <option value="{{ p.id }}" {% if category.parent_id == p.id %}selected{% endif %}>{{ p.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="flex gap-2">
    <button type="submit" class="btn btn-gold">💾 Сохранить</button>
    <a href="{% url 'admin-category-list' %}" class="btn btn-ghost">Отмена</a>
  </div>
</form>
{% endblock %}
